[project]
name = "wetting-angle-kit"
description = "A Python library to parse MD trajectories from LAMMPS and ASE and measure the contact angle through different methods"
authors = [
    { name = "Gabriel Taillandier", email = "gabriel.taillandier@matgenix.com" },
    { name = "Matgenix", email = "info@matgenix.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.1",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.15.0",
    "pre-commit",
]
doc = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinxemoji",
    "sphinx-copybutton",
    "sphinx-argparse",
    "sphinx-code-tabs",
    "sphinx-issues",
    "nbsphinx>=0.8.0",
    "sphinxcontrib-mermaid",
    "myst-parser",
]
viz = [
    "ipython>=8.0.0",
]
ase = ["ase>=3.23.0"]
ovito = ["ovito~=3.11.3"]
# scikit-image is only needed for whole-kind extraction with a grid
# extractor (InterfaceExtractor with SpaceSampling.grid paired with
# SurfaceFitter.whole), which uses marching cubes to recover a
# 3D shell from the binned density. Slicing-only workflows do not
# need this extra.
grid3d = ["scikit-image>=0.22"]
# Convenience extra: installs both trajectory backends and the optional
# visualization helpers. Use ``[all,dev,doc]`` for a full developer setup.
all = [
    "ase>=3.23.0",
    "ovito~=3.11.3",
    "ipython>=8.0.0",
    "scikit-image>=0.22",
]

[project.urls]
"Homepage" = "https://github.com/Matgenix/wetting-angle-kit"
"Source" = "https://github.com/Matgenix/wetting-angle-kit"
"Bug Tracker" = "https://github.com/Matgenix/wetting-angle-kit/issues"
"Documentation" = "https://matgenix.github.io/wetting-angle-kit"

[build-system]
requires = ["setuptools==76.0.0", "versioningit ~= 1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wetting_angle_kit*"]

[tool.versioningit]
default-version = "0.1.2"

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.2"

[tool.versioningit.write]
file = "src/wetting_angle_kit/_version.py"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
strict = true
# NumPy reductions (np.mean, etc.) and ASE attributes (frame.positions) are
# typed as Any in their stubs, so functions returning them legitimately trip
# no-any-return under ``strict``. Re-enable if/when those returns are wrapped
# in ``np.asarray`` or ``cast(np.ndarray, ...)``.
warn_return_any = false
# NumPy's ndarray accepts shape and dtype generic parameters that almost no
# call-site is prepared to specify (``np.ndarray[Any, np.dtype[Any]]`` is the
# closest equivalent of a bare ``np.ndarray`` annotation). Disabling
# disallow_any_generics keeps the rest of ``strict`` active while letting
# arrays continue to be annotated as ``np.ndarray``. Reach for
# ``numpy.typing.NDArray`` (or ``cast``) at the boundaries where a more
# precise type would genuinely help readers.
disallow_any_generics = false

# scipy, mpl_toolkits and plotly have no stubs installed. Disable only
# import-untyped (module exists but lacks py.typed / stubs); import-not-found
# (module doesn't exist at all — catches typos and removed dependencies) stays
# active.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# ASE's ase.io.read(index=":") is typed as Union[Atoms, list[Atoms]] even
# though it always returns a list when ``index=":"``; suppress only the
# resulting union-attr / arg-type cascade in parsers/ase.py rather than
# silencing the whole module. ``no-untyped-call`` covers ase.neighborlist's
# NeighborList API, which has no inline type information in current stubs.
module = ["ase.*", "wetting_angle_kit.parsers.ase"]
disable_error_code = ["union-attr", "arg-type", "no-untyped-call"]

[[tool.mypy.overrides]]
# scikit-image is an optional dependency installed via the ``grid3d``
# extra; the grid extractors import it lazily and raise a clean
# ImportError otherwise. Telling mypy to ignore missing imports for
# ``skimage.*`` makes inline ``# type: ignore[import-not-found]``
# unnecessary AND keeps the check passing whether or not the user has
# scikit-image in their environment — otherwise running mypy with and
# without the extra produces flipped error states.
module = ["skimage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --durations=10 --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require trajectory fixtures and run end-to-end",
    "unit: marks unit tests (default; the marker is optional)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = []
